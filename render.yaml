services:
  - type: web
    name: tumblr-tag-battle
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: TUMBLR_API_KEY
        sync: false
      - key: TUMBLR_API_SECRET
        sync: false
      - key: TUMBLR_ACCESS_TOKEN
        sync: false
      - key: TUMBLR_ACCESS_SECRET
        sync: false
      - key: SECRET_KEY
        sync: false