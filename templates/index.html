</html><!DOCTYPE html>
<html>
<head>
    <title>Results — Tumblr Tag Battle</title>
</head>
<body>
    <div class="cursor">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>

    <form action="/compare" method="POST">
        <div class="form-row"> 
            <span class="tag-input"># <input type="text" name="tag1" placeholder="tag1"> </span>
            <span class="vs">vs</span>
            <span class="tag-input"># <input type="text" name="tag2" placeholder="tag2"> </span>
        </div>
        
        <button type="submit">battle</button>
    </form>
    <div style="text-align: center;">
        <a href="/">← Try another battle</a>
    </div>

    <script> 
    const coords = { x: 0, y: 0 };
    const circles = document.querySelectorAll(".circle");

    const cursor = document.querySelector(".cursor");

    circles.forEach(function (circle, index) {
    circle.x = 0;
    circle.y = 0;
    circle.style.backgroundColor = "blue";
    });

    window.addEventListener("mousemove", function (e) {
    coords.x = e.clientX;
    coords.y = e.clientY;
    });

    function animateCircles() {
    let x = coords.x;
    let y = coords.y;

    cursor.style.top = x;
    cursor.style.left = y;
    
    circles.forEach(function (circle, index) {
        circle.style.left = x - 39 + "px";
        circle.style.top = y - 39 + "px";

        circle.style.scale = (circles.length - index) / circles.length;

        circle.x = x;
        circle.y = y;

        const nextCircle = circles[index + 1] || circles[0];
        x += (nextCircle.x - x) * 0.3;
        y += (nextCircle.y - y) * 0.3;
    });

    requestAnimationFrame(animateCircles);
    }

    animateCircles();

    </script>    
</body>

</html>
